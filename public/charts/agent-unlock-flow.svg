<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="How an AI agent sells a digital product with Shieldz: the agent calls the create_unlock MCP tool with an address, price, payload and acceptable-use confirmation; a hosted paywall link is created; the buyer pays crypto straight to the owner's wallet; the secret is revealed automatically on paid confirmation, and the owner gets a one-time email on the first sale with a dashboard claim link.">
  <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#153a2c"/><stop offset="1" stop-color="#0f2a20"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="759" height="429" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="760" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">An AI agent sells a file, end to end</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">No account, no API key, no custody. Delivery is automatic; the human owner claims later.</text>
  <line x1="191" y1="188" x2="197" y2="188" stroke="#333" stroke-width="1.8"/><path d="M196 184 l6 4 l-6 4" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="373" y1="188" x2="379" y2="188" stroke="#333" stroke-width="1.8"/><path d="M378 184 l6 4 l-6 4" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="555" y1="188" x2="561" y2="188" stroke="#333" stroke-width="1.8"/><path d="M560 184 l6 4 l-6 4" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28" y="136" width="158" height="104" rx="14" fill="url(#sg)" stroke="#57d497" stroke-width="2"/><text x="107" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Agent creates</text><text x="107" y="198" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">create_unlock over</text><text x="107" y="215" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">MCP, no API key</text>
<rect x="210" y="136" width="158" height="104" rx="14" fill="#1e1e1e" stroke="#333" stroke-width="1"/><text x="289" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Paywall link</text><text x="289" y="198" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">hosted page with</text><text x="289" y="215" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">price and pitch</text>
<rect x="392" y="136" width="158" height="104" rx="14" fill="url(#sg)" stroke="#57d497" stroke-width="2"/><text x="471" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Buyer pays</text><text x="471" y="198" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">crypto straight to</text><text x="471" y="215" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">the owner's wallet</text>
<rect x="574" y="136" width="158" height="104" rx="14" fill="#1e1e1e" stroke="#333" stroke-width="1"/><text x="653" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Auto-delivery</text><text x="653" y="198" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">secret revealed on</text><text x="653" y="215" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">paid confirmation</text>
  <line x1="107" y1="102" x2="107" y2="130" stroke="#2fb573" stroke-width="1.4" stroke-dasharray="4 4"/><text x="107" y="94" text-anchor="start" font-size="12" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif" transform="translate(-52,0)">one tool call: address, price, payload, aup_accepted</text><line x1="653" y1="246" x2="653" y2="274" stroke="#2fb573" stroke-width="1.4" stroke-dasharray="4 4"/><text x="653" y="292" text-anchor="middle" font-size="12" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">owner gets a one-time email on the first sale</text><text x="653" y="309" text-anchor="middle" font-size="12" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">with a claim link to a full dashboard</text>
  <text x="732" y="414" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash · structure of an agent-created unlock sale</text>
