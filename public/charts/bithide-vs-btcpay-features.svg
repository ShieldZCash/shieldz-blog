<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 548" width="860" height="548" role="img" aria-label="Feature comparison. BitHide: proprietary, quote on request, USDT and USDC built in, no Lightning, keys stored on your server, AML screening built in via providers, bulk payouts. BTCPay Server: MIT open source, free, Bitcoin-first with altcoins via plugins, Lightning, watch-only xpub setup possible, no built-in AML screening, payouts via a hot wallet.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="547" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">BitHide vs BTCPay Server: what each one gives you</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Self-hosted crypto payment software, feature by feature</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">self-hosted</text>
  <text x="330" y="102" font-size="13" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">BitHide</text><text x="590" y="102" font-size="13" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">BTCPay Server</text><line x1="28" y1="116" x2="832" y2="116" stroke="#242424"/><text x="28" y="138" font-size="14.5" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Open-source code</text><text x="28" y="155" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">audit and fork it</text><circle cx="340" cy="138" r="10" fill="none" stroke="#3a3a3a" stroke-width="1.8"/><path d="M336 138 h8" stroke="#9c9c9c" stroke-width="2" stroke-linecap="round"/><text x="358" y="143" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Proprietary</text><circle cx="600" cy="138" r="10" fill="url(#g)"/><path d="M595 138 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="618" y="143" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">MIT license</text><line x1="28" y1="168" x2="832" y2="168" stroke="#242424"/><text x="28" y="190" font-size="14.5" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Published price</text><text x="28" y="207" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">know the cost before talking to sales</text><circle cx="340" cy="190" r="10" fill="none" stroke="#3a3a3a" stroke-width="1.8"/><path d="M336 190 h8" stroke="#9c9c9c" stroke-width="2" stroke-linecap="round"/><text x="358" y="195" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Quote on request</text><circle cx="600" cy="190" r="10" fill="url(#g)"/><path d="M595 190 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="618" y="195" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Free</text><line x1="28" y1="220" x2="832" y2="220" stroke="#242424"/><text x="28" y="242" font-size="14.5" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">USDT and USDC built in</text><text x="28" y="259" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">ERC-20, TRC-20, BEP-20</text><circle cx="340" cy="242" r="10" fill="url(#g)"/><path d="M335 242 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="358" y="247" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Yes</text><circle cx="600" cy="242" r="10" fill="none" stroke="#3a3a3a" stroke-width="1.8"/><path d="M596 242 h8" stroke="#9c9c9c" stroke-width="2" stroke-linecap="round"/><text x="618" y="247" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Bitcoin-first; altcoins via plugins</text><line x1="28" y1="272" x2="832" y2="272" stroke="#242424"/><text x="28" y="294" font-size="14.5" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Lightning</text><text x="28" y="311" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">instant small BTC payments</text><circle cx="340" cy="294" r="10" fill="none" stroke="#3a3a3a" stroke-width="1.8"/><path d="M336 294 h8" stroke="#9c9c9c" stroke-width="2" stroke-linecap="round"/><text x="358" y="299" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">No</text><circle cx="600" cy="294" r="10" fill="url(#g)"/><path d="M595 294 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="618" y="299" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Yes</text><line x1="28" y1="324" x2="832" y2="324" stroke="#242424"/><text x="28" y="346" font-size="14.5" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Watch-only setup possible</text><text x="28" y="363" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">no spending keys on the server</text><circle cx="340" cy="346" r="10" fill="none" stroke="#3a3a3a" stroke-width="1.8"/><path d="M336 346 h8" stroke="#9c9c9c" stroke-width="2" stroke-linecap="round"/><text x="358" y="351" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Keys stored on your server</text><circle cx="600" cy="346" r="10" fill="url(#g)"/><path d="M595 346 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="618" y="351" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Yes, with an xpub</text><line x1="28" y1="376" x2="832" y2="376" stroke="#242424"/><text x="28" y="398" font-size="14.5" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">AML screening built in</text><text x="28" y="415" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">score incoming and outgoing flows</text><circle cx="340" cy="398" r="10" fill="url(#g)"/><path d="M335 398 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="358" y="403" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Yes, via providers</text><circle cx="600" cy="398" r="10" fill="none" stroke="#3a3a3a" stroke-width="1.8"/><path d="M596 398 h8" stroke="#9c9c9c" stroke-width="2" stroke-linecap="round"/><text x="618" y="403" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Not built in</text><line x1="28" y1="428" x2="832" y2="428" stroke="#242424"/><text x="28" y="450" font-size="14.5" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Bulk payouts</text><text x="28" y="467" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">pay many addresses at once</text><circle cx="340" cy="450" r="10" fill="url(#g)"/><path d="M335 450 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="358" y="455" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Yes</text><circle cx="600" cy="450" r="10" fill="url(#g)"/><path d="M595 450 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="618" y="455" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Yes, via payouts (hot wallet)</text><text x="28" y="508" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Both run on your own server and keep custody with you. They are built for different businesses.</text>
  <text x="28" y="532" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Sources: bithide.io and btcpayserver.org / docs.btcpayserver.org, checked 2026-10-28.</text>
  <text x="832" y="532" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
