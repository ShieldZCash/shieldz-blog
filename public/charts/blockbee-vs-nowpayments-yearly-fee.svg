<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 352" width="860" height="352" role="img" aria-label="Yearly platform fee on 10,000 dollars a month of crypto revenue: BlockBee 1,200 dollars at 1 percent, NOWPayments 1,200 dollars at 1 percent, Shieldz 0 dollars.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="351" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Yearly fee on $10,000 a month of crypto revenue</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Platform fee at each provider's published list rate</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">USD / yr</text>
  <text x="28" y="116" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">BlockBee</text><text x="28" y="135" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">1% standard deposit fee</text><rect x="318" y="102" width="313.6" height="30" rx="8" fill="#3a3a3a"/><text x="643.6" y="123" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$1,200 / yr</text>
  <text x="28" y="178" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">NOWPayments</text><text x="28" y="197" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">1% service fee (pricing page)</text><rect x="318" y="164" width="313.6" height="30" rx="8" fill="#3a3a3a"/><text x="643.6" y="185" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$1,200 / yr</text>
  <text x="28" y="240" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Shieldz</text><text x="28" y="259" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$0 platform fee</text><rect x="318" y="226" width="4.0" height="30" rx="8" fill="url(#g)"/><text x="334.0" y="247" font-size="16" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">$0</text><text x="28" y="312" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Platform fee only. Blockchain network fees come on top for all of them; conversion and fiat payout add more on NOWPayments.</text>
  <text x="28" y="336" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Sources: blockbee.io/fees, nowpayments.io/pricing, shieldz.cash/pricing. Checked 2026-10-28.</text>
  <text x="832" y="336" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
