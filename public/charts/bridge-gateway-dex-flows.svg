<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="What each one moves. A DEX swaps one token for another on the same chain, for example USDC on Base to ETH on Base, through a pool or order book. A bridge moves the same asset to a different chain, for example USDC on Ethereum to USDC on Solana, by locking, burning or fronting it. A payment gateway moves a payment from a buyer to a merchant: the buyer pays in crypto, the gateway watches the chain, and the merchant gets the funds plus a paid notification.">
  <rect x="0.5" y="0.5" width="759" height="469" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="760" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">DEX, bridge, gateway: what each one moves</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">A DEX changes the token, a bridge changes the chain, a gateway changes the owner.</text>

  <!-- row 1: DEX -->
  <text x="28" y="132" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">DEX</text>
  <text x="28" y="152" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">new token,</text>
  <text x="28" y="168" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">same chain</text>
  <rect x="150" y="104" width="170" height="78" rx="14" fill="#1e1e1e" stroke="#333"/>
  <text x="235" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">USDC on Base</text>
  <text x="235" y="160" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">your wallet</text>
  <rect x="362" y="104" width="170" height="78" rx="14" fill="#153a2c" stroke="#57d497" stroke-width="1.6"/>
  <text x="447" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Pool / order book</text>
  <text x="447" y="160" text-anchor="middle" font-size="12" fill="#b9b9b9" font-family="ui-sans-serif,system-ui,sans-serif">one transaction</text>
  <rect x="574" y="104" width="158" height="78" rx="14" fill="#1e1e1e" stroke="#333"/>
  <text x="653" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">ETH on Base</text>
  <text x="653" y="160" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">your wallet</text>

  <!-- row 2: Bridge -->
  <text x="28" y="248" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Bridge</text>
  <text x="28" y="268" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">same asset,</text>
  <text x="28" y="284" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">new chain</text>
  <rect x="150" y="220" width="170" height="78" rx="14" fill="#1e1e1e" stroke="#333"/>
  <text x="235" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">USDC on Ethereum</text>
  <text x="235" y="276" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">chain A</text>
  <rect x="362" y="220" width="170" height="78" rx="14" fill="#153a2c" stroke="#57d497" stroke-width="1.6"/>
  <text x="447" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Lock, burn or front</text>
  <text x="447" y="276" text-anchor="middle" font-size="12" fill="#b9b9b9" font-family="ui-sans-serif,system-ui,sans-serif">two chains, one message</text>
  <rect x="574" y="220" width="158" height="78" rx="14" fill="#1e1e1e" stroke="#333"/>
  <text x="653" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">USDC on Solana</text>
  <text x="653" y="276" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">chain B</text>

  <!-- row 3: Gateway -->
  <text x="28" y="364" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Gateway</text>
  <text x="28" y="384" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">new owner,</text>
  <text x="28" y="400" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">plus a receipt</text>
  <rect x="150" y="336" width="170" height="78" rx="14" fill="#1e1e1e" stroke="#333"/>
  <text x="235" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Buyer pays</text>
  <text x="235" y="392" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">checkout, any wallet</text>
  <rect x="362" y="336" width="170" height="78" rx="14" fill="#153a2c" stroke="#57d497" stroke-width="1.6"/>
  <text x="447" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Watch and confirm</text>
  <text x="447" y="392" text-anchor="middle" font-size="12" fill="#b9b9b9" font-family="ui-sans-serif,system-ui,sans-serif">invoice, amount, chain</text>
  <rect x="574" y="336" width="158" height="78" rx="14" fill="#1e1e1e" stroke="#333"/>
  <text x="653" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Merchant paid</text>
  <text x="653" y="392" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">funds + webhook</text>

  <!-- arrows -->
  <g fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="326" y1="143" x2="354" y2="143"/><path d="M349 138 l6 5 l-6 5"/>
    <line x1="538" y1="143" x2="566" y2="143"/><path d="M561 138 l6 5 l-6 5"/>
    <line x1="326" y1="259" x2="354" y2="259"/><path d="M349 254 l6 5 l-6 5"/>
    <line x1="538" y1="259" x2="566" y2="259"/><path d="M561 254 l6 5 l-6 5"/>
    <line x1="326" y1="375" x2="354" y2="375"/><path d="M349 370 l6 5 l-6 5"/>
    <line x1="538" y1="375" x2="566" y2="375"/><path d="M561 370 l6 5 l-6 5"/>
  </g>
  <text x="28" y="448" font-size="12" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">A cross-chain swap (BTC on Bitcoin to USDC on Base) does the first two at once. Routers race the services that can.</text>
</svg>
