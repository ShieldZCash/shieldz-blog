  <text x="30" y="40" font-size="21" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Processor fee on a $100 Bitcoin sale</text>
  <text x="30" y="62" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Lower is better. Shieldz takes no cut; the buyer covers their own network fee.</text>
