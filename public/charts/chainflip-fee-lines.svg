<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Where the fees go on 0.1 BTC to ETH via Chainflip. Every fee line in Chainflip's own quote for a $8,049 swap, in US dollars">
  <defs>
    <linearGradient id="gGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57d497"/>
      <stop offset="1" stop-color="#2fb573"/>
    </linearGradient>
    <linearGradient id="gGradH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fb573"/>
      <stop offset="1" stop-color="#57d497"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="399" rx="16" fill="#161616" stroke="#262626"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Where the fees go on 0.1 BTC to ETH via Chainflip</text>
  <text x="30" y="60" font-size="13" fill="#777777" font-family="ui-sans-serif,system-ui,sans-serif">Every fee line in Chainflip's own quote for a $8,049 swap, in US dollars</text>
  <text x="734" y="38" text-anchor="end" font-size="12" font-weight="600" fill="#2fb573" font-family="ui-sans-serif,system-ui,sans-serif">USD, total $24.59 (0.31%)</text>
  <text x="236" y="122.2" text-anchor="end" font-size="13" fill="#57d497" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">Broker (Shieldz fee)</text>
    <rect x="250" y="104.2" width="360.0" height="26.0" rx="6" fill="url(#gGradH)"/>
    <text x="620.0" y="122.2" font-size="14" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">$12.07  0.15%</text>
    <text x="236" y="172.6" text-anchor="end" font-size="13" fill="#9c9c9c" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif">Chainflip network fee</text>
    <rect x="250" y="154.6" width="240.1" height="26.0" rx="6" fill="#3a3a3a"/>
    <text x="500.1" y="172.6" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$8.05  0.10%</text>
    <text x="236" y="223.0" text-anchor="end" font-size="13" fill="#9c9c9c" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif">Boost (faster BTC credit)</text>
    <rect x="250" y="205.0" width="119.9" height="26.0" rx="6" fill="#3a3a3a"/>
    <text x="379.9" y="223.0" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$4.02  0.05%</text>
    <text x="236" y="273.4" text-anchor="end" font-size="13" fill="#9c9c9c" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif">Bitcoin deposit (ingress)</text>
    <rect x="250" y="255.4" width="9.2" height="26.0" rx="6" fill="#3a3a3a"/>
    <text x="269.2" y="273.4" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$0.31</text>
    <text x="236" y="323.8" text-anchor="end" font-size="13" fill="#9c9c9c" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif">ETH payout (egress gas)</text>
    <rect x="250" y="305.8" width="4.2" height="26.0" rx="6" fill="#3a3a3a"/>
    <text x="264.2" y="323.8" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$0.14</text>
  <text x="30" y="384" font-size="11" fill="#777777" font-family="ui-sans-serif,system-ui,sans-serif">Chainflip quote via swap.shieldz.cash, 27 Oct 2026. The broker line is the 0.15% Shieldz service fee.</text>
  <text x="734" y="384" text-anchor="end" font-size="11" fill="#777777" font-family="ui-sans-serif,system-ui,sans-serif">shieldz.cash</text>
</svg>
