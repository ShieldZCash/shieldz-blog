<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Confidential crypto payment flow. Stage one, the buyer pays on the source chain, is public. Stage two, the confidential swap through NEAR intents, is shielded. Stage three, settlement to your wallet, is public. Confidential routing breaks the link between the buyer and the seller at the swap.">
  <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#153a2c"/><stop offset="1" stop-color="#0f2a20"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="759" height="359" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="760" height="5" fill="#2fb573"/>
  <text x="30" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">What a confidential crypto payment shields</text>
  <text x="30" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Both ends stay public on-chain. The swap in the middle is shielded, so the two ends do not link.</text>
  <line x1="226" y1="178" x2="271" y2="178" stroke="#333" stroke-width="1.8"/><path d="M270 174 l6 4 l-6 4" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="481" y1="178" x2="526" y2="178" stroke="#333" stroke-width="1.8"/><path d="M525 174 l6 4 l-6 4" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <rect x="30" y="132" width="190" height="108" rx="14" fill="#1e1e1e" stroke="#333" stroke-width="1"/>
  <path d="M114 166 q11 -9 22 0 q-11 9 -22 0 z" fill="none" stroke="#9c9c9c" stroke-width="1.6"/><circle cx="125" cy="166" r="3" fill="#9c9c9c"/>
  <text x="125" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Buyer pays</text>
  <text x="125" y="216" text-anchor="middle" font-size="12.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">source chain</text>
  <rect x="91" y="254" width="68" height="20" rx="10" fill="#2a2a2a"/>
  <text x="125" y="268" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.06em" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">PUBLIC</text>

  <rect x="285" y="132" width="190" height="108" rx="14" fill="url(#sg)" stroke="#57d497" stroke-width="2"/>
  <path d="M380 157 l8 3 v5 q0 6 -8 10 q-8 -4 -8 -10 v-5 z" fill="none" stroke="#57d497" stroke-width="1.6" stroke-linejoin="round"/><path d="M376.5 166 l2.5 2.5 l5 -5.5" fill="none" stroke="#57d497" stroke-width="1.6" stroke-linecap="round"/>
  <text x="380" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Confidential swap</text>
  <text x="380" y="216" text-anchor="middle" font-size="12.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">NEAR intents</text>
  <rect x="346" y="254" width="68" height="20" rx="10" fill="#2fb573"/>
  <text x="380" y="268" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.06em" fill="#0c1f17" font-family="ui-sans-serif,system-ui,sans-serif">SHIELDED</text>

  <rect x="540" y="132" width="190" height="108" rx="14" fill="#1e1e1e" stroke="#333" stroke-width="1"/>
  <path d="M624 166 q11 -9 22 0 q-11 9 -22 0 z" fill="none" stroke="#9c9c9c" stroke-width="1.6"/><circle cx="635" cy="166" r="3" fill="#9c9c9c"/>
  <text x="635" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">You settle</text>
  <text x="635" y="216" text-anchor="middle" font-size="12.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">your wallet</text>
  <rect x="601" y="254" width="68" height="20" rx="10" fill="#2a2a2a"/>
  <text x="635" y="268" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.06em" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">PUBLIC</text>
  
  <line x1="125" y1="298" x2="635" y2="298" stroke="#57d497" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="125" y1="293" x2="125" y2="303" stroke="#57d497" stroke-width="1.4"/>
  <line x1="635" y1="293" x2="635" y2="303" stroke="#57d497" stroke-width="1.4"/>
  <text x="380" y="320" text-anchor="middle" font-size="12.5" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">buyer-to-seller link is broken at the swap</text>
  <text x="730" y="344" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash · structure of a confidential swap payment</text>
</svg>
