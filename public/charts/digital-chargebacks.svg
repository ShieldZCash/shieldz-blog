    <text x="147.3" y="382.0" text-anchor="middle" font-size="13" font-weight="400" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Credit card</text>
    <rect x="343.0" y="198.5" width="78.0" height="157.5" rx="7" fill="#3a3a3a"/>
    <text x="382.0" y="187.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.6%</text>
    <text x="382.0" y="382.0" text-anchor="middle" font-size="13" font-weight="400" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">PayPal</text>
    <rect x="577.7" y="352.0" width="78.0" height="4.0" rx="7" fill="url(#gGrad)"/>
