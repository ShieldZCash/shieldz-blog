  <line x1="30" y1="219.0" x2="734.0" y2="219.0" stroke="#242424" stroke-width="1"/>
  <line x1="30" y1="287.5" x2="734.0" y2="287.5" stroke="#242424" stroke-width="1"/>
  <line x1="30" y1="356.0" x2="734.0" y2="356.0" stroke="#242424" stroke-width="1"/>
  
    <rect x="108.3" y="119.8" width="78.0" height="236.2" rx="7" fill="#3a3a3a"/>
