  <text x="30" y="404" font-size="11" fill="#777777" font-family="ui-sans-serif,system-ui,sans-serif">Nonprofit rates: cards ~2.2%+30¢, PayPal Giving Fund 1.99%. Shieldz: 0% platform fee.</text>
