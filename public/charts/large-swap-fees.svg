  <text x="28" y="454" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Published swap fees, checked 2026-10-13. Shieldz: 0.05% on NEAR Intents and Relay routes; Chainflip routes stay 0.15%.</text>
  <text x="832" y="454" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
