  <text x="28" y="170" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">MetaMask</text><text x="28" y="188" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.875%</text><rect x="250" y="156" width="437.5" height="30" rx="8" fill="#3a3a3a"/><text x="697.5" y="176" font-size="13" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">$8,750</text>
  <text x="28" y="226" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Phantom</text><text x="28" y="244" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.85% on select pairs</text><rect x="250" y="212" width="425.0" height="30" rx="8" fill="#3a3a3a"/><text x="685.0" y="232" font-size="13" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">$8,500</text>
  <text x="28" y="282" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Rabby</text><text x="28" y="300" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.25%</text><rect x="250" y="268" width="125.0" height="30" rx="8" fill="#3a3a3a"/><text x="385.0" y="288" font-size="13" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">$2,500</text>
