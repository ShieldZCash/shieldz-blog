  <rect x="0.5" y="0.5" width="919" height="469" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="920" height="5" fill="url(#g)"/>
  <text x="30" y="40" font-size="21" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Setup before your first crypto payment</text>
  <text x="30" y="62" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Lower is better. One URL, nothing to sign up for or install.</text>
