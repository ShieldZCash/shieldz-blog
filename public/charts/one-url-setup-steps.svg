<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="Setup steps before your first crypto payment (illustrative): BTCPay self-host about 6, Stripe cards about 5, a custodial crypto API about 4, and Shieldz just 1, building one URL.">
