  <line x1="30" y1="277.3" x2="890" y2="277.3" stroke="#242424"/><text x="896" y="281.3" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">2</text>
  <line x1="30" y1="374.0" x2="890" y2="374.0" stroke="#242424"/><text x="896" y="378.0" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0</text>
  <rect x="89.5" y="110.4" width="96" height="263.6" rx="6" fill="#3a3a3a"/><text x="137.5" y="99.4" text-anchor="middle" font-size="17" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">6</text><text x="137.5" y="396.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">BTCPay (self-host)</text><text x="137.5" y="414.0" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">server + wallet + config</text>
  <rect x="304.5" y="154.3" width="96" height="219.7" rx="6" fill="#3a3a3a"/><text x="352.5" y="143.3" text-anchor="middle" font-size="17" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">5</text><text x="352.5" y="396.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Stripe (cards)</text><text x="352.5" y="414.0" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">account, KYC, keys, SDK, webhook</text>
  <rect x="519.5" y="198.2" width="96" height="175.8" rx="6" fill="#3a3a3a"/><text x="567.5" y="187.2" text-anchor="middle" font-size="17" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">4</text><text x="567.5" y="396.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Custodial crypto API</text><text x="567.5" y="414.0" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">account, KYC, key, config</text>
