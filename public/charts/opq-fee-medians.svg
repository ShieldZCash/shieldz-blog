  <text x="200" y="176.5" text-anchor="end" font-size="13.5" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Fee published (all 61)</text><rect x="210" y="157.7" width="250.0" height="29.51666666666667" rx="6" fill="url(#sg)"/><text x="470.0" y="176.5" font-size="13.5" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">0.5%</text>
