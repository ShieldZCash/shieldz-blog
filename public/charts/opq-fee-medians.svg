  <text x="200" y="337.5" text-anchor="end" font-size="13.5" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Fiat settlement</text><rect x="210" y="318.7" width="500.0" height="29.51666666666667" rx="6" fill="#3a3a3a"/><text x="720.0" y="337.5" font-size="13.5" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">1.0%</text>
  <text x="200" y="391.2" text-anchor="end" font-size="13.5" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Fee not published*</text><rect x="210" y="372.4" width="500.0" height="29.51666666666667" rx="6" fill="#3a3a3a"/><text x="720.0" y="391.2" font-size="13.5" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">1.0%</text><text x="210" y="440" font-size="12" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">*Median of the indicative figures collected from third-party sources for the 25 gateways without an official public price.</text>
