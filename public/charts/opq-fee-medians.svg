<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="Horizontal bar chart of median per-transaction fees by trait, August 2026: no KYC to start 0.4 percent; fee published 0.5 percent; crypto-only settlement 0.5 percent; KYC required 1 percent; fiat settlement 1 percent; fee not published, indicative, 1 percent.">
  <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#57d497"/><stop offset="1" stop-color="#2fb573"/></linearGradient><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0706a"/><stop offset="1" stop-color="#c9524c"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="919" height="469" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="920" height="5" fill="#57d497"/>
  <text x="34" y="38" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Median per-transaction fee, by transparency trait</text>
  <text x="34" y="60" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Groups that publish and skip KYC cluster at 0.4 to 0.5%; groups that gate and hide cluster at 1%.</text>
