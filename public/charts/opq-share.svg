<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-label="Stacked bar of 86 crypto payment gateways in August 2026: 61 gateways, 71 percent, publish a fee checkable on an official page; 25 gateways, 29 percent, do not publish a verifiable fee.">
  <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#57d497"/><stop offset="1" stop-color="#2fb573"/></linearGradient><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0706a"/><stop offset="1" stop-color="#c9524c"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="919" height="299" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="920" height="5" fill="#57d497"/>
  <text x="34" y="38" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Can you check the fee before you sign up?</text>
  <text x="34" y="60" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">86 crypto payment gateways, August 2026. Verification against each provider's own pricing page.</text>
  
  <rect x="34" y="130" width="600.1" height="64" rx="8" fill="url(#sg)"/>
  <rect x="637.1" y="130" width="242.9" height="64" rx="8" fill="url(#rg)"/>
  <text x="34" y="116" font-size="14" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">61 gateways (71%) publish a checkable fee</text>
  <text x="880" y="116" text-anchor="end" font-size="14" font-weight="700" fill="#e0706a" font-family="ui-sans-serif,system-ui,sans-serif">25 (29%) do not</text>
  <text x="334.0" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#0b2417" font-family="ui-sans-serif,system-ui,sans-serif">fee on an official page</text>
  <text x="757.0" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#2a0f0e" font-family="ui-sans-serif,system-ui,sans-serif">not published</text>
  <text x="34" y="232" font-size="13" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">"Not published" = the standard per-transaction fee could not be confirmed on the provider's own pricing page or docs; the dataset marks those fees as indicative.</text>
  <text x="880" y="286" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash · open dataset, n=86, Aug 2026</text>
</svg>
