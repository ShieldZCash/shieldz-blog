<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Horizontal bar chart of the share of gateways with unpublished fees by trait, August 2026: KYC required 40 percent, 21 of 53; fiat settlement 37 percent, 21 of 57; crypto-only 14 percent, 4 of 29; no KYC to start 8 percent, 2 of 24.">
  <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#57d497"/><stop offset="1" stop-color="#2fb573"/></linearGradient><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0706a"/><stop offset="1" stop-color="#c9524c"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="919" height="399" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="920" height="5" fill="#57d497"/>
  <text x="34" y="38" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Unpublished fees travel with KYC and fiat settlement</text>
  <text x="34" y="60" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">The same providers that gate signup and touch bank rails are the ones without a public price.</text>
  <text x="160" y="129.5" text-anchor="end" font-size="13.5" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">KYC required</text><rect x="170" y="107.5" width="504.0" height="36" rx="6" fill="url(#rg)"/><text x="684.0" y="129.5" font-size="13.5" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">40%  <tspan font-weight="400" fill="#777">(21 of 53)</tspan></text>
  <text x="160" y="196.5" text-anchor="end" font-size="13.5" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Fiat settlement</text><rect x="170" y="174.5" width="466.2" height="36" rx="6" fill="url(#rg)"/><text x="646.2" y="196.5" font-size="13.5" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">37%  <tspan font-weight="400" fill="#777">(21 of 57)</tspan></text>
  <text x="160" y="263.5" text-anchor="end" font-size="13.5" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Crypto-only</text><rect x="170" y="241.5" width="176.4" height="36" rx="6" fill="url(#sg)"/><text x="356.4" y="263.5" font-size="13.5" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">14%  <tspan font-weight="400" fill="#777">(4 of 29)</tspan></text>
  <text x="160" y="330.5" text-anchor="end" font-size="13.5" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">No KYC to start</text><rect x="170" y="308.5" width="100.8" height="36" rx="6" fill="url(#sg)"/><text x="280.8" y="330.5" font-size="13.5" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">8%  <tspan font-weight="400" fill="#777">(2 of 24)</tspan></text>
  <text x="880" y="386" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash · open dataset, n=86, Aug 2026</text>
