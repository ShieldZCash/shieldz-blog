  <line x1="390.0" y1="88" x2="390.0" y2="358" stroke="#242424"/><text x="390.0" y="376" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$450</text>
  <line x1="530.0" y1="88" x2="530.0" y2="358" stroke="#242424"/><text x="530.0" y="376" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$900</text>
  <line x1="670.0" y1="88" x2="670.0" y2="358" stroke="#242424"/><text x="670.0" y="376" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$1,350</text>
  <line x1="810.0" y1="88" x2="810.0" y2="358" stroke="#242424"/><text x="810.0" y="376" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$1,800</text>
  <text x="236" y="126.8" text-anchor="end" font-size="14" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">PayRam, large VPS</text><text x="236" y="143.8" text-anchor="end" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$150/mo</text><rect x="250" y="109.1" width="560.0" height="39.3" rx="5" fill="#3a3a3a"/><text x="820.0" y="133.8" font-size="15" font-weight="700" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">$1,800</text>
  <text x="236" y="192.3" text-anchor="end" font-size="14" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">PayRam, small VPS</text><text x="236" y="209.3" text-anchor="end" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$20/mo</text><rect x="250" y="174.6" width="74.7" height="39.3" rx="5" fill="#3a3a3a"/><text x="334.7" y="199.3" font-size="15" font-weight="700" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">$240</text>
  <text x="236" y="257.8" text-anchor="end" font-size="14" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Shieldz Pro (optional)</text><text x="236" y="274.8" text-anchor="end" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">removes the sponsored card</text><rect x="250" y="240.1" width="30.8" height="39.3" rx="5" fill="url(#g)"/><text x="290.8" y="264.8" font-size="15" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">$99</text>
  <text x="236" y="323.3" text-anchor="end" font-size="14" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Shieldz Free</text><text x="236" y="340.3" text-anchor="end" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">no server</text><rect x="250" y="305.6" width="4.0" height="39.3" rx="5" fill="url(#g)"/><text x="264.0" y="330.3" font-size="15" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">$0</text>
  <text x="30" y="402" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Source: PayRam's own "~$20-$150/mo VPS" (payram.com/white-label), shieldz.cash/pricing. Excludes your time on updates.</text>
  <text x="890" y="402" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
