<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="Yearly running cost before any payment fees. PayRam on a $150 per month VPS: $1,800. PayRam on a $20 per month VPS: $240. Shieldz Pro, optional: $99. Shieldz Free: $0.">
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#57d497"/><stop offset="1" stop-color="#2fb573"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="919" height="419" rx="16" fill="#161616" stroke="#262626"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">What it costs to keep the gateway running, per year</text>
  <text x="30" y="62" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Before network gas. Neither charges a percentage of your sales.</text>
  <text x="890" y="40" text-anchor="end" font-size="12" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">USD / year</text>
