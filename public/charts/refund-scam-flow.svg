<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Anatomy of the overpayment refund scam: an invoice is overpaid with tainted funds, the scammer urgently requests the excess be refunded to a different address, the merchant sends clean crypto, then the original funds are frozen or clawed back and the merchant loses both. The fix is refunding only to the paying address, only after settlement, never under time pressure.">
  <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#153a2c"/><stop offset="1" stop-color="#0f2a20"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="759" height="439" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="760" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Anatomy of the overpayment refund scam</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">The most expensive merchant scam in crypto, because it spends your money, not the buyer's.</text>
  <line x1="191" y1="184" x2="197" y2="184" stroke="#333" stroke-width="1.8"/><path d="M196 180 l6 4 l-6 4" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="373" y1="184" x2="379" y2="184" stroke="#333" stroke-width="1.8"/><path d="M378 180 l6 4 l-6 4" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="555" y1="184" x2="561" y2="184" stroke="#333" stroke-width="1.8"/><path d="M560 180 l6 4 l-6 4" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28" y="132" width="158" height="104" rx="14" fill="#1e1e1e" stroke="#333" stroke-width="1"/><text x="107" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">1. Overpay</text><text x="107" y="194" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">invoice paid with</text><text x="107" y="211" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">tainted funds</text>
<rect x="210" y="132" width="158" height="104" rx="14" fill="#1e1e1e" stroke="#e2635e" stroke-width="1.6"/><text x="289" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#e2635e" font-family="ui-sans-serif,system-ui,sans-serif">2. The ask</text><text x="289" y="194" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">“refund the extra,</text><text x="289" y="211" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">new address please”</text>
<rect x="392" y="132" width="158" height="104" rx="14" fill="#1e1e1e" stroke="#e2635e" stroke-width="1.6"/><text x="471" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#e2635e" font-family="ui-sans-serif,system-ui,sans-serif">3. You refund</text><text x="471" y="194" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">your clean crypto</text><text x="471" y="211" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">leaves your wallet</text>
<rect x="574" y="132" width="158" height="104" rx="14" fill="#1e1e1e" stroke="#e2635e" stroke-width="1.6"/><text x="653" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#e2635e" font-family="ui-sans-serif,system-ui,sans-serif">4. The loss</text><text x="653" y="194" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">original funds frozen,</text><text x="653" y="211" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">you are out both</text>
  
  <rect x="28" y="258" width="704" height="58" rx="14" fill="url(#sg)" stroke="#57d497" stroke-width="1.6"/>
  <text x="380" y="282" text-anchor="middle" font-size="14.5" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">The fix: refund only to the address that paid, only after settlement, never under time pressure.</text>
  <text x="380" y="302" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">A new refund address plus urgency is the scam's signature. Slow down and it collapses.</text>
  <text x="732" y="424" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash · structure of the scam, not a measured flow</text>
</svg>
