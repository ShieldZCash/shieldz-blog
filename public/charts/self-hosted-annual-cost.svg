<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="Illustrative annual cost of accepting payments at 10,000 dollars a month with a 50 dollar average order. Card processor 4,344 dollars, custodial crypto processor at 1 percent 1,200 dollars, self-hosted gateway 1,440 dollars from a 240 dollar server plus 24 hours of upkeep valued at 50 dollars an hour, Shieldz 0 dollars platform fee.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#57d497"/><stop offset="1" stop-color="#2fb573"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="919" height="469" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="920" height="5" fill="url(#g)"/>
  <text x="44" y="38" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Annual cost at $10,000/month in sales</text>
  <text x="44" y="60" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">2,880 orders at $50. Self-hosted assumes a $20/mo VPS and 2 h/mo of upkeep at $50/h. Illustrative.</text>
  <text x="890" y="38" text-anchor="end" font-size="13" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">USD / year</text>
  <line x1="44" y1="86.0" x2="864" y2="86.0" stroke="#242424"/><text x="870" y="90.0" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$5,000</text>
  <line x1="44" y1="142.0" x2="864" y2="142.0" stroke="#242424"/><text x="870" y="146.0" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$4,000</text>
  <line x1="44" y1="198.0" x2="864" y2="198.0" stroke="#242424"/><text x="870" y="202.0" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$3,000</text>
  <line x1="44" y1="254.0" x2="864" y2="254.0" stroke="#242424"/><text x="870" y="258.0" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$2,000</text>
  <line x1="44" y1="310.0" x2="864" y2="310.0" stroke="#242424"/><text x="870" y="314.0" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$1,000</text>
  <line x1="44" y1="366.0" x2="864" y2="366.0" stroke="#242424"/><text x="870" y="370.0" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$0</text>
  <rect x="98.5" y="122.7" width="96" height="243.3" rx="6" fill="#3a3a3a"/>
  <text x="146.5" y="112.7" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$4,344</text>
  <text x="146.5" y="388" text-anchor="middle" font-size="13" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Card processor</text>
  <text x="146.5" y="406" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">2.9% + $0.30 / order</text>
  <rect x="303.5" y="298.8" width="96" height="67.2" rx="6" fill="#3a3a3a"/>
  <text x="351.5" y="288.8" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$1,200</text>
  <text x="351.5" y="388" text-anchor="middle" font-size="13" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Custodial crypto</text>
  <text x="351.5" y="406" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">1% / order</text>
  <rect x="508.5" y="285.4" width="96" height="80.6" rx="6" fill="#3a3a3a"/>
  <text x="556.5" y="275.4" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$1,440</text>
  <text x="556.5" y="388" text-anchor="middle" font-size="13" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Self-hosted</text>
  <text x="556.5" y="406" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$240 VPS + 24 h upkeep</text>
  <rect x="713.5" y="362.0" width="96" height="4.0" rx="6" fill="url(#g)"/>
  <text x="761.5" y="352.0" text-anchor="middle" font-size="16" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">$0</text>
  <text x="761.5" y="388" text-anchor="middle" font-size="13" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Shieldz</text>
  <text x="761.5" y="406" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$0 + buyer-paid gas</text>
  <text x="44" y="454" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Source: public list rates (Stripe US 2.9% + 30c). Network fees excluded for all crypto options.</text>
  <text x="890" y="454" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
