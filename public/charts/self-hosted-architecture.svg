<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-label="Architecture of a self-hosted crypto payment gateway. Your store asks the gateway on your server for an invoice. The gateway derives a fresh address from your watch-only extended public key and shows it on the checkout. The customer pays from their wallet directly to your wallet on the blockchain. Your node or indexer sees the transaction, the gateway marks the invoice paid and sends a signed webhook to your store. Funds never pass through the server.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#57d497"/><stop offset="1" stop-color="#2fb573"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="919" height="499" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="920" height="5" fill="url(#g)"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">How a self-hosted crypto payment gateway works</text>
  <text x="30" y="62" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">The server coordinates and watches. The money moves wallet to wallet on-chain and never touches the box.</text>
  <rect x="300" y="96" width="400" height="236" rx="16" fill="none" stroke="#3a3a3a" stroke-dasharray="5 5"/>
  <text x="686" y="118" text-anchor="end" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">YOUR SERVER</text>
  
  <rect x="320" y="132" width="170" height="70" rx="12" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="1"/>
  <text x="405" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Gateway app</text>
  <text x="405" y="183" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">invoices, checkout, API</text>
  
  <rect x="510" y="132" width="170" height="70" rx="12" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="1"/>
  <text x="595" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Watch-only xpub</text>
  <text x="595" y="183" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">derives a fresh address</text>
  
  <rect x="320" y="242" width="360" height="70" rx="12" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="1"/>
  <text x="500" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Node or indexer</text>
  <text x="500" y="293" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">full / pruned node, Electrum server, RPC</text>
  
  <rect x="24" y="132" width="170" height="70" rx="12" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="1"/>
  <text x="109" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Your store</text>
  <text x="109" y="183" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">WooCommerce, API, POS</text>
  
  <rect x="24" y="370" width="170" height="70" rx="12" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="1"/>
  <text x="109" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Customer wallet</text>
  <text x="109" y="421" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">pays the invoice</text>
  
  <rect x="730" y="216" width="166" height="70" rx="12" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="1"/>
  <text x="813" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Blockchain</text>
  <text x="813" y="267" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">public ledger</text>
  
  <rect x="730" y="370" width="166" height="70" rx="12" fill="#11291f" stroke="#57d497" stroke-width="1.6"/>
  <text x="813" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Your wallet</text>
  <text x="813" y="421" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">keys stay offline</text>
  <line x1="194" y1="152" x2="311.0" y2="152.0" stroke="#3a3a3a" stroke-width="1.6"/>
  <polygon points="320,152 311.0,157.0 311.0,147.0" fill="#3a3a3a"/>
  <text x="247" y="144" text-anchor="middle" font-size="11" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">1. invoice</text>
  <line x1="490" y1="167" x2="501.0" y2="167.0" stroke="#3a3a3a" stroke-width="1.6"/>
  <polygon points="510,167 501.0,172.0 501.0,162.0" fill="#3a3a3a"/>
  
  <line x1="320" y1="184" x2="203.0" y2="184.0" stroke="#3a3a3a" stroke-width="1.6"/>
  <polygon points="194,184 203.0,179.0 203.0,189.0" fill="#3a3a3a"/>
  <text x="247" y="202" text-anchor="middle" font-size="11" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">4. paid webhook</text>
  <line x1="680" y1="277" x2="722.0" y2="255.2" stroke="#3a3a3a" stroke-width="1.6"/>
  <polygon points="730,251 724.3,259.6 719.7,250.7" fill="#3a3a3a"/>
  <text x="813" y="206" text-anchor="middle" font-size="11" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">2. watch chain</text>
  <line x1="194" y1="405" x2="721.0" y2="405.0" stroke="#57d497" stroke-width="1.6"/>
  <polygon points="730,405 721.0,410.0 721.0,400.0" fill="#57d497"/>
  <text x="462" y="397" text-anchor="middle" font-size="11" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">3. payment goes wallet to wallet, never via the server</text>
  <line x1="813" y1="370" x2="813.0" y2="295.0" stroke="#3a3a3a" stroke-width="1.6"/>
  <polygon points="813,286 818.0,295.0 808.0,295.0" fill="#3a3a3a"/>
  
  <text x="822" y="332" font-size="11" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">settles on-chain</text>
  <text x="30" y="482" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Generic architecture of BTCPay-style gateways. Hot-wallet and Lightning setups add keys to the server.</text>
  <text x="890" y="482" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
