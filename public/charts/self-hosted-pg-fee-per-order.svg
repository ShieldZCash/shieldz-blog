<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 538" width="860" height="538" role="img" aria-label="Fee on a 50 dollar order: OwnPay through PayPal $2.24, Stripe Checkout $1.75, Hyperswitch self-hosted routing to Stripe $1.75, Kill Bill to Stripe $1.75, BTCPay Server 0 dollars plus network fee, Shieldz 0 dollars plus network fee.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="537" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">What a $50 order costs through each option</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Payment fee per order at US list rates, before your own server costs</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">USD</text>
  <text x="28" y="116" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">OwnPay → PayPal</text><text x="28" y="135" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">self-hosted · PayPal 3.49% + 49¢</text><rect x="318" y="102" width="337.0" height="30" rx="8" fill="#3a3a3a"/><text x="667.0" y="123" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$2.24</text>
  <text x="28" y="178" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Stripe Checkout</text><text x="28" y="197" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">hosted · 2.9% + 30¢</text><rect x="318" y="164" width="263.8" height="30" rx="8" fill="#3a3a3a"/><text x="593.8" y="185" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$1.75</text>
  <text x="28" y="240" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Hyperswitch → Stripe</text><text x="28" y="259" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">self-hosted orchestration · Stripe still charges</text><rect x="318" y="226" width="263.8" height="30" rx="8" fill="#3a3a3a"/><text x="593.8" y="247" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$1.75</text>
  <text x="28" y="302" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Kill Bill → Stripe</text><text x="28" y="321" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">self-hosted billing · Stripe still charges</text><rect x="318" y="288" width="263.8" height="30" rx="8" fill="#3a3a3a"/><text x="593.8" y="309" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$1.75</text>
  <text x="28" y="364" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">BTCPay Server</text><text x="28" y="383" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">self-hosted crypto · no processor</text><rect x="318" y="350" width="4.0" height="30" rx="8" fill="url(#g)"/><text x="334.0" y="371" font-size="16" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">$0 + network fee</text>
  <text x="28" y="426" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Shieldz</text><text x="28" y="445" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">hosted, non-custodial crypto</text><rect x="318" y="412" width="4.0" height="30" rx="8" fill="url(#g)"/><text x="334.0" y="433" font-size="16" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">$0 + network fee</text><text x="28" y="498" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Self-hosting the software removes license and platform fees. On cards, the processor's fee stays; only crypto has no processor.</text>
  <text x="28" y="522" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Sources: stripe.com/pricing (2.9% + 30¢), paypal.com merchant fees (3.49% + 49¢). Crypto network fees are paid by the buyer.</text>
  <text x="832" y="522" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
