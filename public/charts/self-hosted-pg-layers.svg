<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 474" width="860" height="474" role="img" aria-label="Which layers of a payment can be self-hosted. Cards: checkout page yes, routing yes, card vault yes but PCI DSS becomes yours, processor and acquirer no, card network no. Crypto: checkout yes, routing yes, keys yes, no processor needed, public blockchain open to anyone.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="473" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Which parts of a payment can you self-host?</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">The layers every payment passes through, for cards and for crypto</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">self-host?</text>
  <text x="330" y="102" font-size="13" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Card payments</text><text x="600" y="102" font-size="13" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Crypto payments</text><line x1="28" y1="116" x2="832" y2="116" stroke="#242424"/><text x="28" y="140" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Checkout page</text><text x="28" y="158" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">the form the buyer sees</text><circle cx="340" cy="140" r="10" fill="url(#g)"/><path d="M335 140 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="358" y="145" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Yes, with hosted fields to stay in SAQ A</text><circle cx="610" cy="140" r="10" fill="url(#g)"/><path d="M605 140 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="628" y="145" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Yes</text><line x1="28" y1="174" x2="832" y2="174" stroke="#242424"/><text x="28" y="198" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Routing and orchestration</text><text x="28" y="216" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">which processor gets the payment</text><circle cx="340" cy="198" r="10" fill="url(#g)"/><path d="M335 198 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="358" y="203" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Yes (Hyperswitch)</text><circle cx="610" cy="198" r="10" fill="url(#g)"/><path d="M605 198 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="628" y="203" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Yes</text><line x1="28" y1="232" x2="832" y2="232" stroke="#242424"/><text x="28" y="256" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Card vault or keys</text><text x="28" y="274" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">where the secret lives</text><circle cx="340" cy="256" r="10" fill="url(#g)"/><path d="M335 256 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="358" y="261" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Yes, but PCI DSS becomes yours</text><circle cx="610" cy="256" r="10" fill="url(#g)"/><path d="M605 256 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="628" y="261" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Yes, your own wallet</text><line x1="28" y1="290" x2="832" y2="290" stroke="#242424"/><text x="28" y="314" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Processor and acquirer</text><text x="28" y="332" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">who moves and settles the money</text><circle cx="340" cy="314" r="10" fill="none" stroke="#a05050" stroke-width="1.8"/><path d="M336 310 l8 8 M344 310 l-8 8" stroke="#c46a6a" stroke-width="2" stroke-linecap="round"/><text x="358" y="319" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">No: licensed bank or processor</text><circle cx="610" cy="314" r="10" fill="url(#g)"/><path d="M605 314 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="628" y="319" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Not needed: you watch the chain</text><line x1="28" y1="348" x2="832" y2="348" stroke="#242424"/><text x="28" y="372" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Network</text><text x="28" y="390" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">card scheme or blockchain</text><circle cx="340" cy="372" r="10" fill="none" stroke="#a05050" stroke-width="1.8"/><path d="M336 368 l8 8 M344 368 l-8 8" stroke="#c46a6a" stroke-width="2" stroke-linecap="round"/><text x="358" y="377" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">No: Visa, Mastercard rules</text><circle cx="610" cy="372" r="10" fill="url(#g)"/><path d="M605 372 l3.5 3.5 l6.5 -7" stroke="#0d2a1c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="628" y="377" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Public, open to anyone</text><text x="28" y="434" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">With cards you can self-host the software around the payment. With crypto you can self-host the payment itself.</text>
  <text x="28" y="458" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Shieldz analysis of PCI DSS scope and the Hyperswitch, Kill Bill and BTCPay Server architectures, October 2026.</text>
  <text x="832" y="458" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
