<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 496" width="920" height="496" role="img" aria-label="Responsibility matrix. A self-hosted gateway makes the merchant own seven operational jobs: keys, server, updates, node sync, uptime monitoring, hardening and backups. A hosted non-custodial gateway leaves only the key backup. A custodial processor removes the operational jobs but requires trusting a third party with the funds.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#57d497"/><stop offset="1" stop-color="#2fb573"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="919" height="495" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="920" height="5" fill="url(#g)"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Who does which job</text>
  <text x="30" y="62" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Self-hosting moves every operational job onto you. Custody is the only row that actually carries counterparty risk.</text>
  <text x="448.3333333333333" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Self-hosted</text>
  <text x="625" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">Hosted non-custodial</text>
  <text x="801.6666666666666" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Custodial</text>
  <rect x="20" y="128" width="880" height="38" rx="8" fill="#1b1b1b"/><text x="34" y="152" font-size="13.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Hold the keys / seed backup</text><circle cx="448.3333333333333" cy="147" r="9" fill="none" stroke="#9c9c9c" stroke-width="1.8"/><circle cx="448.3333333333333" cy="147" r="4" fill="#9c9c9c"/><circle cx="625" cy="147" r="9" fill="none" stroke="#57d497" stroke-width="1.8"/><circle cx="625" cy="147" r="4" fill="#57d497"/><line x1="794.6666666666666" y1="147" x2="808.6666666666666" y2="147" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/>
  <text x="34" y="190" font-size="13.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Provision and pay for a server</text><circle cx="448.3333333333333" cy="185" r="9" fill="none" stroke="#9c9c9c" stroke-width="1.8"/><circle cx="448.3333333333333" cy="185" r="4" fill="#9c9c9c"/><line x1="618" y1="185" x2="632" y2="185" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/><line x1="794.6666666666666" y1="185" x2="808.6666666666666" y2="185" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/>
  <rect x="20" y="204" width="880" height="38" rx="8" fill="#1b1b1b"/><text x="34" y="228" font-size="13.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">OS, app and node updates</text><circle cx="448.3333333333333" cy="223" r="9" fill="none" stroke="#9c9c9c" stroke-width="1.8"/><circle cx="448.3333333333333" cy="223" r="4" fill="#9c9c9c"/><line x1="618" y1="223" x2="632" y2="223" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/><line x1="794.6666666666666" y1="223" x2="808.6666666666666" y2="223" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/>
  <text x="34" y="266" font-size="13.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Node sync, disk and bandwidth</text><circle cx="448.3333333333333" cy="261" r="9" fill="none" stroke="#9c9c9c" stroke-width="1.8"/><circle cx="448.3333333333333" cy="261" r="4" fill="#9c9c9c"/><line x1="618" y1="261" x2="632" y2="261" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/><line x1="794.6666666666666" y1="261" x2="808.6666666666666" y2="261" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/>
  <rect x="20" y="280" width="880" height="38" rx="8" fill="#1b1b1b"/><text x="34" y="304" font-size="13.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Uptime monitoring and alerts</text><circle cx="448.3333333333333" cy="299" r="9" fill="none" stroke="#9c9c9c" stroke-width="1.8"/><circle cx="448.3333333333333" cy="299" r="4" fill="#9c9c9c"/><line x1="618" y1="299" x2="632" y2="299" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/><line x1="794.6666666666666" y1="299" x2="808.6666666666666" y2="299" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/>
  <text x="34" y="342" font-size="13.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">TLS, firewall, SSH hardening</text><circle cx="448.3333333333333" cy="337" r="9" fill="none" stroke="#9c9c9c" stroke-width="1.8"/><circle cx="448.3333333333333" cy="337" r="4" fill="#9c9c9c"/><line x1="618" y1="337" x2="632" y2="337" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/><line x1="794.6666666666666" y1="337" x2="808.6666666666666" y2="337" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/>
  <rect x="20" y="356" width="880" height="38" rx="8" fill="#1b1b1b"/><text x="34" y="380" font-size="13.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Database and config backups</text><circle cx="448.3333333333333" cy="375" r="9" fill="none" stroke="#9c9c9c" stroke-width="1.8"/><circle cx="448.3333333333333" cy="375" r="4" fill="#9c9c9c"/><line x1="618" y1="375" x2="632" y2="375" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/><line x1="794.6666666666666" y1="375" x2="808.6666666666666" y2="375" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/>
  <text x="34" y="418" font-size="13.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Trust someone else with funds</text><line x1="441.3333333333333" y1="413" x2="455.3333333333333" y2="413" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/><line x1="618" y1="413" x2="632" y2="413" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/><circle cx="801.6666666666666" cy="413" r="9" fill="none" stroke="#e0745a" stroke-width="1.8"/><circle cx="801.6666666666666" cy="413" r="4" fill="#e0745a"/>
  <text x="448.3333333333333" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">7 ops jobs</text>
  <text x="625" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">1 ops job</text>
  <text x="801.6666666666666" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">0 ops jobs</text>
  <text x="890" y="482" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
