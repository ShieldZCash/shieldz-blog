  <rect x="304.5" y="164.2" width="96" height="213.8" rx="6" fill="#3a3a3a"/><text x="352.5" y="153.2" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$3.20</text><text x="352.5" y="400.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Stripe (card)</text><text x="352.5" y="418.0" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">2.9% + $0.30</text>
