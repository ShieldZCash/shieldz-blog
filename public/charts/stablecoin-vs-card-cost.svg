<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="What a $100 sale costs to accept in 2026: PayPal $3.98, Stripe card $3.20, Coinbase Commerce $1.00, and a Shieldz stablecoin payment about $0.01 (zero platform fee plus a cent of Base network gas).">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#57d497"/><stop offset="1" stop-color="#2fb573"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="919" height="469" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="920" height="5" fill="url(#g)"/>
  <text x="30" y="40" font-size="21" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">What a $100 sale costs you to accept</text>
  <text x="30" y="62" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Lower is better. A stablecoin payment on Base keeps almost the whole $100.</text>
