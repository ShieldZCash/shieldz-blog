<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="Service fee on a 1,000 dollar swap: MetaMask Swaps 8.75 dollars (0.875 percent), Phantom 8.50 dollars (0.85 percent on select pairs), Shieldz Swap 1.50 dollars (0.15 percent on every route).">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="359" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Service fee on a $1,000 swap</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">What the app itself charges. Protocol, liquidity and network costs come on top for all three.</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">USD</text>
  <text x="28" y="120" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">MetaMask Swaps</text><text x="28" y="139" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.875% MetaMask fee, also on bridges</text><rect x="298" y="106" width="379.5" height="30" rx="8" fill="#3a3a3a"/><text x="689.5" y="127" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$8.75</text>
  <text x="28" y="190" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Phantom</text><text x="28" y="209" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.85% on select pairs, more cross-chain</text><rect x="298" y="176" width="368.6" height="30" rx="8" fill="#3a3a3a"/><text x="678.6" y="197" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$8.50</text>
  <text x="28" y="260" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Shieldz Swap</text><text x="28" y="279" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.15% on every route, shown per quote</text><rect x="298" y="246" width="65.1" height="30" rx="8" fill="url(#g)"/><text x="375.1" y="267" font-size="16" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">$1.50</text>
  <text x="28" y="344" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Sources: MetaMask Swaps user guide, Phantom Help Center, swap.shieldz.cash/terms (October 2026)</text>
  <text x="832" y="344" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
