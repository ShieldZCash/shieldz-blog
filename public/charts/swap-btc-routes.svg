  <text x="28" y="194" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents</text><text x="28" y="213" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">settles in ~13.5 min</text><rect x="258" y="180" width="235.1" height="30" rx="8" fill="#3a3a3a"/><text x="505.1" y="201" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">3.2114 ETH</text><text x="28" y="296" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Same request, same second: 0.0070 ETH (about $18) apart, and the better route also lands six minutes sooner.</text>
  <text x="28" y="324" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Measured on swap.shieldz.cash, 2026-10-07. Relay does not take native BTC deposits.</text>
  <text x="832" y="324" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
