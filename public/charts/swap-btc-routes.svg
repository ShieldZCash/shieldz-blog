<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-label="0.1 BTC to ETH quoted at the same moment: Chainflip 3.2184 ETH settling in about 7 minutes, NEAR Intents 3.2114 ETH settling in about 13.5 minutes. Chainflip was picked.">
