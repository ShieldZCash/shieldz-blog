  <rect x="0.5" y="0.5" width="859" height="339" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.1 native BTC to ETH: two protocols, two prices</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">ETH you would receive, after every fee, as quoted by each protocol (axis starts at 3.2)</text>
