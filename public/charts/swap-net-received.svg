<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="What a merchant keeps from a 100 dollar sale: about 99 dollars through a custodial processor at the 1 percent median fee, about 99.70 through swap-settle where the only cost is the rail spread, and about 99.99 with direct same-coin settlement. Swap figures illustrative.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#57d497"/><stop offset="1" stop-color="#2fb573"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="919" height="469" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="920" height="5" fill="url(#g)"/>
  <text x="30" y="40" font-size="21" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">What you keep from a $100 sale</text>
  <text x="30" y="62" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Higher is better. With no platform fee, the only swap cost is the rail's own spread.</text>
  <text x="890" y="40" text-anchor="end" font-size="12" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">net received</text>
  <line x1="30" y1="378.0" x2="890" y2="378.0" stroke="#242424"/><text x="894" y="382.0" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$98.5</text><line x1="30" y1="288.9" x2="890" y2="288.9" stroke="#242424"/><text x="894" y="292.9" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$99.0</text><line x1="30" y1="199.8" x2="890" y2="199.8" stroke="#242424"/><text x="894" y="203.8" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$99.5</text><line x1="30" y1="110.7" x2="890" y2="110.7" stroke="#242424"/><text x="894" y="114.7" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$100.0</text>
  <rect x="108.3" y="288.9" width="130" height="89.1" rx="8" fill="#3a3a3a"/><text x="173.3" y="277.9" text-anchor="middle" font-size="17" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$99.00</text><text x="173.3" y="402.0" text-anchor="middle" font-size="14" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Custodial processor</text><text x="173.3" y="421.0" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">1% median fee (our 50-gateway data)</text>
  <rect x="395.0" y="164.2" width="130" height="213.8" rx="8" fill="url(#g)"/><text x="460.0" y="153.2" text-anchor="middle" font-size="17" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">~$99.70</text><text x="460.0" y="402.0" text-anchor="middle" font-size="14" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Swap-settle via rails</text><text x="460.0" y="421.0" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$0 platform fee; rail spread only</text>
  <rect x="681.7" y="112.5" width="130" height="265.5" rx="8" fill="url(#g)"/><text x="746.7" y="101.5" text-anchor="middle" font-size="17" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">~$99.99</text><text x="746.7" y="402.0" text-anchor="middle" font-size="14" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Direct same-coin</text><text x="746.7" y="421.0" text-anchor="middle" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">$0 fee; about a cent of gas</text>
  <text x="890" y="455" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash · median fee from our 50-gateway dataset; swap spread illustrative</text>
</svg>
