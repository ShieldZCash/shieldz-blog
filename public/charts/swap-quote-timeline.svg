<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="One ETH to BTC: THORChain answered at 0.40 seconds with 0.031501 BTC settling in about 42 seconds, Chainflip at 0.44 seconds with 0.031574 BTC in about 8 minutes, NEAR Intents at 0.63 seconds with 0.031451 BTC in about 8 minutes. THORChain was picked for settling faster.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="379" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">1 ETH to BTC: quotes stream in as each protocol answers</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Time from request to each protocol's quote, as the swap form receives them</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">seconds</text>
  <line x1="200" y1="96" x2="200" y2="282" stroke="#242424"/><text x="200" y="300" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0s</text><line x1="371.42857142857144" y1="96" x2="371.42857142857144" y2="282" stroke="#242424"/><text x="371.42857142857144" y="300" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.2s</text><line x1="542.8571428571429" y1="96" x2="542.8571428571429" y2="282" stroke="#242424"/><text x="542.8571428571429" y="300" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.4s</text><line x1="714.2857142857142" y1="96" x2="714.2857142857142" y2="282" stroke="#242424"/><text x="714.2857142857142" y="300" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.6s</text><text x="28" y="125" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">THORChain</text><rect x="200" y="108" width="341.1" height="26" rx="7" fill="url(#g)"/><text x="551.1" y="126" font-size="14" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">0.40s</text><text x="200" y="150" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.031501 BTC · ~42 s to settle</text>
  <text x="28" y="183" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Chainflip</text><rect x="200" y="166" width="378.9" height="26" rx="7" fill="#3a3a3a"/><text x="588.9" y="184" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.44s</text><text x="200" y="208" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.031574 BTC · ~8 min to settle</text>
  <text x="28" y="241" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents</text><rect x="200" y="224" width="543.4" height="26" rx="7" fill="#3a3a3a"/><text x="753.4" y="242" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.63s</text><text x="200" y="266" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.031451 BTC · ~8 min to settle</text><text x="28" y="336" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">The first route is on screen at 0.40 s. The race ends at 0.64 s; THORChain stays the pick because it settles 7 minutes sooner.</text>
  <text x="28" y="364" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Measured on api.shieldz.cash/v1/quote/stream, 2026-10-06.</text>
  <text x="832" y="364" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
