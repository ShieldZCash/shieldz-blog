<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="One ETH to USDC on Arbitrum: Relay answered at 0.67 seconds with 2,587.86 USDC settling in about 24 seconds, NEAR Intents at 0.79 seconds with 2,588.55 USDC in about 46 seconds, Chainflip at 0.84 seconds with 2,594.00 USDC in about 2.7 minutes. Chainflip was picked.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="379" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">1 ETH to USDC on Arbitrum: quotes stream in as each protocol answers</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Time from request to each protocol's quote, as the swap form receives them</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">seconds</text>
  <line x1="200" y1="96" x2="200" y2="282" stroke="#242424"/><text x="200" y="300" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0s</text><line x1="350" y1="96" x2="350" y2="282" stroke="#242424"/><text x="350" y="300" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.25s</text><line x1="500" y1="96" x2="500" y2="282" stroke="#242424"/><text x="500" y="300" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.5s</text><line x1="650" y1="96" x2="650" y2="282" stroke="#242424"/><text x="650" y="300" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.75s</text><line x1="800" y1="96" x2="800" y2="282" stroke="#242424"/><text x="800" y="300" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">1s</text><text x="28" y="125" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Relay</text><rect x="200" y="108" width="402.0" height="26" rx="7" fill="#3a3a3a"/><text x="612.0" y="126" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.67s</text><text x="200" y="150" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">2,587.86 USDC · ~24 s to settle</text>
  <text x="28" y="183" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents</text><rect x="200" y="166" width="473.4" height="26" rx="7" fill="#3a3a3a"/><text x="683.4" y="184" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.79s</text><text x="200" y="208" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">2,588.55 USDC · ~46 s to settle</text>
  <text x="28" y="241" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Chainflip</text><rect x="200" y="224" width="502.2" height="26" rx="7" fill="url(#g)"/><text x="712.2" y="242" font-size="14" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">0.84s</text><text x="200" y="266" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">2,594.00 USDC · ~2.7 min to settle</text><text x="28" y="336" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">The first route is on screen at 0.67 s. The race ends at 0.85 s; Chainflip, last to answer, pays the most and is picked.</text>
  <text x="28" y="364" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Measured on swap.shieldz.cash, 2026-10-07.</text>
  <text x="832" y="364" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
