<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="One ETH to USDC on Base, quoted by three protocols at the same moment: NEAR Intents 2,706.90 USDC, Relay 2,704.87 USDC, THORChain 2,704.13 USDC. NEAR Intents was picked.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="379" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">1 ETH to USDC on Base: three protocols, three prices</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">USDC you would receive, after every fee, as quoted by each protocol (axis starts at 2,700)</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">USDC out</text>
  <text x="28" y="120" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents</text><text x="28" y="139" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">settles in ~47 s · picked</text><rect x="258" y="106" width="389.9" height="30" rx="8" fill="url(#g)"/><text x="659.9" y="127" font-size="16" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">2,706.90 USDC</text>
  <text x="28" y="194" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Relay</text><text x="28" y="213" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">settles in ~2 s</text><rect x="258" y="180" width="275.2" height="30" rx="8" fill="#3a3a3a"/><text x="545.2" y="201" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">2,704.87 USDC</text>
  <text x="28" y="268" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">THORChain</text><text x="28" y="287" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">settles in ~2.6 min</text><rect x="258" y="254" width="233.3" height="30" rx="8" fill="#3a3a3a"/><text x="503.3" y="275" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">2,704.13 USDC</text><text x="28" y="336" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Same request, same second: the best and worst route differ by $2.77. Chainflip has no Base USDC route.</text>
  <text x="28" y="364" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Measured on swap.shieldz.cash, 2026-10-06. Quotes move every second; the gap is what matters.</text>
  <text x="832" y="364" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
