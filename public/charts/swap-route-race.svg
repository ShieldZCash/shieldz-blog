<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="One ETH to USDC on Arbitrum, quoted by three protocols at the same moment: Chainflip 2,594.00 USDC, NEAR Intents 2,588.55 USDC, Relay 2,587.86 USDC. Chainflip was picked.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="379" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">1 ETH to USDC on Arbitrum: three protocols, three prices</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">USDC you would receive, after every fee, as quoted by each protocol (axis starts at 2,584)</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">USDC out</text>
  <text x="28" y="120" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Chainflip</text><text x="28" y="139" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">settles in ~2.7 min · picked</text><rect x="258" y="106" width="376.7" height="30" rx="8" fill="url(#g)"/><text x="646.7" y="127" font-size="16" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">2,594.00 USDC</text>
  <text x="28" y="194" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents</text><text x="28" y="213" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">settles in ~46 s</text><rect x="258" y="180" width="171.4" height="30" rx="8" fill="#3a3a3a"/><text x="441.4" y="201" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">2,588.55 USDC</text>
  <text x="28" y="268" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Relay</text><text x="28" y="287" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">settles in ~24 s</text><rect x="258" y="254" width="145.4" height="30" rx="8" fill="#3a3a3a"/><text x="415.4" y="275" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">2,587.86 USDC</text><text x="28" y="336" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Same request, same second: the best and worst route differ by $6.14, four times the whole Shieldz fee.</text>
  <text x="28" y="364" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Measured on swap.shieldz.cash, 2026-10-07. Quotes move every second; the gap is what matters.</text>
  <text x="832" y="364" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
