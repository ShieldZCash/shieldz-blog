<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Lifecycle of a swap-settled crypto payment: the buyer pays any supported coin, three independent rails are quoted and ranked by net output, the winning rail executes the swap non-custodially, and the merchant settles in one coin straight to their own wallet. Route health is probed every five minutes and a refund path is verified before a coin is offered.">
  <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#153a2c"/><stop offset="1" stop-color="#0f2a20"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="759" height="429" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="760" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">How a swap-settled payment routes</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">The gateway never holds the funds. It quotes, ranks and watches; independent rails move the money.</text>
  <line x1="191" y1="190" x2="197" y2="190" stroke="#333" stroke-width="1.8"/><path d="M196 186 l6 4 l-6 4" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="373" y1="190" x2="379" y2="190" stroke="#333" stroke-width="1.8"/><path d="M378 186 l6 4 l-6 4" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="555" y1="190" x2="561" y2="190" stroke="#333" stroke-width="1.8"/><path d="M560 186 l6 4 l-6 4" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28" y="140" width="158" height="100" rx="14" fill="#1e1e1e" stroke="#333" stroke-width="1"/><text x="107" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Buyer pays</text><text x="107" y="200" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">BTC, ETH, LTC,</text><text x="107" y="217" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">TON, ZEC, more</text>
<rect x="210" y="140" width="158" height="100" rx="14" fill="url(#sg)" stroke="#57d497" stroke-width="2"/><text x="289" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Quote & rank</text><text x="289" y="200" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">3 rails quoted,</text><text x="289" y="217" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">best net output wins</text>
<rect x="392" y="140" width="158" height="100" rx="14" fill="#1e1e1e" stroke="#333" stroke-width="1"/><text x="471" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Rail swaps</text><text x="471" y="200" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">independent,</text><text x="471" y="217" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">non-custodial</text>
<rect x="574" y="140" width="158" height="100" rx="14" fill="url(#sg)" stroke="#57d497" stroke-width="2"/><text x="653" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">You settle</text><text x="653" y="200" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">one coin, straight</text><text x="653" y="217" text-anchor="middle" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">to your wallet</text>
  <line x1="289" y1="106" x2="289" y2="134" stroke="#2fb573" stroke-width="1.4" stroke-dasharray="4 4"/><text x="289" y="98" text-anchor="middle" font-size="12" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">route health probed every 5 min; unhealthy rails hidden</text><line x1="471" y1="246" x2="471" y2="274" stroke="#2fb573" stroke-width="1.4" stroke-dasharray="4 4"/><text x="471" y="292" text-anchor="middle" font-size="12" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">if the swap fails, funds return by the refund path</text><text x="471" y="309" text-anchor="middle" font-size="12" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">checked before the coin is even offered</text>
  <text x="732" y="414" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash · structure of a swap-settled payment</text>
</svg>
