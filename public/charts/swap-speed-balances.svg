<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="Balance scan of one wallet across 23 EVM chains: the first chain's balances arrive at 0.12 seconds, half the chains by 0.16 seconds, and all 23 chains with 74 holdings by about 1.0 second.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="359" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">A wallet's balances on 23 chains, streamed in about a second</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">One public EVM wallet (vitalik.eth), scanned across every EVM chain Shieldz Swap supports (median of 4 runs)</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">seconds</text>
  <line x1="250" y1="96" x2="250" y2="278" stroke="#242424"/><text x="250" y="296" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0s</text><line x1="358.33333333333337" y1="96" x2="358.33333333333337" y2="278" stroke="#242424"/><text x="358.33333333333337" y="296" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.25s</text><line x1="466.6666666666667" y1="96" x2="466.6666666666667" y2="278" stroke="#242424"/><text x="466.6666666666667" y="296" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.5s</text><line x1="575" y1="96" x2="575" y2="278" stroke="#242424"/><text x="575" y="296" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.75s</text><line x1="683.3333333333334" y1="96" x2="683.3333333333334" y2="278" stroke="#242424"/><text x="683.3333333333334" y="296" text-anchor="middle" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">1s</text><text x="28" y="122" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">First chain's balances</text><text x="28" y="140" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">on screen while the rest load</text><rect x="250" y="108" width="52.0" height="30" rx="8" fill="url(#g)"/><text x="312.0" y="128" font-size="14" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">0.12s</text>
  <text x="28" y="182" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Half the chains</text><text x="28" y="200" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">12 of 23 chains in</text><rect x="250" y="168" width="69.3" height="30" rx="8" fill="url(#g)"/><text x="329.3" y="188" font-size="14" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">0.16s</text>
  <text x="28" y="242" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">All 23 chains</text><text x="28" y="260" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">74 holdings, none failed</text><rect x="250" y="228" width="433.3" height="30" rx="8" fill="#3a3a3a"/><text x="693.3" y="248" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">1.00s</text>
  <text x="28" y="344" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Measured against live swap.shieldz.cash, 2026-10-10. Each chain's balances are shown the moment that chain answers.</text>
  <text x="832" y="344" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
