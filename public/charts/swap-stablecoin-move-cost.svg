<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-label="Cost of moving 1,000 dollars of stablecoins between chains, all fees included: USDC Ethereum to Arbitrum 1.84 dollars, USDC Solana to Base 3.04, USDT Tron to USDC Base 3.13, USDC Arbitrum to Solana 3.37, USDT Tron to USDC Solana 3.48, USDT Ethereum to Tron 4.87.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="519" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">What it costs to move $1,000 of stablecoins</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Best route for each move, as quoted by the router, all fees included</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">USD</text>
  <text x="28" y="116" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">USDC Ethereum → Arbitrum</text><text x="28" y="135" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Relay · ~1 s</text><rect x="288" y="102" width="141.2" height="30" rx="8" fill="url(#g)"/><text x="441.2" y="123" font-size="16" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">$1.84</text>
  <text x="28" y="178" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">USDC Solana → Base</text><text x="28" y="197" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents · ~22 s</text><rect x="288" y="164" width="233.3" height="30" rx="8" fill="#3a3a3a"/><text x="533.3" y="185" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$3.04</text>
  <text x="28" y="240" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">USDT Tron → USDC Base</text><text x="28" y="259" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents · ~82 s</text><rect x="288" y="226" width="240.2" height="30" rx="8" fill="#3a3a3a"/><text x="540.2" y="247" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$3.13</text>
  <text x="28" y="302" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">USDC Arbitrum → Solana</text><text x="28" y="321" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents · ~22 s</text><rect x="288" y="288" width="258.6" height="30" rx="8" fill="#3a3a3a"/><text x="558.6" y="309" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$3.37</text>
  <text x="28" y="364" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">USDT Tron → USDC Solana</text><text x="28" y="383" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents · ~77 s</text><rect x="288" y="350" width="267.0" height="30" rx="8" fill="#3a3a3a"/><text x="567.0" y="371" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$3.48</text>
  <text x="28" y="426" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">USDT Ethereum → Tron</text><text x="28" y="445" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents · ~100 s</text><rect x="288" y="412" width="373.7" height="30" rx="8" fill="#3a3a3a"/><text x="673.7" y="433" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$4.87</text><text x="28" y="480" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">$1,000 in minus what arrives. Includes the 0.15% Shieldz fee ($1.50) and protocol fees; not the gas your wallet pays to send.</text>
  <text x="28" y="504" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Measured on swap.shieldz.cash, 2026-10-07. Quotes move; live costs for every network at swap.shieldz.cash/usdt.</text>
  <text x="832" y="504" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
