<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="Wallet swap fees on a 1,000 dollar swap: Base app up to 10 dollars, MetaMask 8.75, Phantom 8.50 on select pairs, Rabby 2.50, Shieldz Swap 1.50. On 10,000 dollars: up to 100, 87.50, 85, 25 and 15.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="469" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">What each wallet charges to swap</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">The app's own published swap fee, on a $1,000 swap (bars) and a $10,000 swap</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">USD</text>
  <text x="28" y="116" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Base app (Coinbase Wallet)</text><text x="28" y="135" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">up to 1%</text><rect x="288" y="102" width="312.6" height="30" rx="8" fill="#3a3a3a"/><text x="612.6" y="123" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">up to $10 · $100</text>
  <text x="28" y="178" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">MetaMask</text><text x="28" y="197" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.875%</text><rect x="288" y="164" width="273.5" height="30" rx="8" fill="#3a3a3a"/><text x="573.5" y="185" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$8.75 · $87.50</text>
  <text x="28" y="240" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Phantom</text><text x="28" y="259" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.85% on select pairs</text><rect x="288" y="226" width="265.7" height="30" rx="8" fill="#3a3a3a"/><text x="565.7" y="247" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$8.50 · $85</text>
  <text x="28" y="302" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Rabby</text><text x="28" y="321" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.25%</text><rect x="288" y="288" width="78.1" height="30" rx="8" fill="#3a3a3a"/><text x="378.1" y="309" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$2.50 · $25</text>
  <text x="28" y="364" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Shieldz Swap</text><text x="28" y="383" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0.15% on every route</text><rect x="288" y="350" width="46.9" height="30" rx="8" fill="url(#g)"/><text x="346.9" y="371" font-size="16" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">$1.50 · $15</text><text x="28" y="430" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Labels: fee on $1,000 · fee on $10,000. App fee only; protocol, liquidity and network costs come on top for all of them.</text>
  <text x="28" y="454" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Sources: MetaMask, Phantom and Coinbase help centers, ethereum.org (Rabby), swap.shieldz.cash/terms. October 2026.</text>
  <text x="832" y="454" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
