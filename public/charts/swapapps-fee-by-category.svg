<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 412" width="860" height="412" role="img" aria-label="Median verified cross-chain swap fee by category: Wallets 0.875%, THORChain/Maya front-ends 0.5%, Instant exchanges 0.5%, Aggregators 0.25%.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="411" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Wallets charge the most for a cross-chain swap</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Median of the verified fees in each category</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">median %</text>
  <text x="28" y="110" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Wallets</text><text x="28" y="127" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">median of 9 verified fees</text><rect x="318" y="96" width="360.5" height="26" rx="7" fill="#f5361c"/><text x="688.5" y="114" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.875%</text>
  <text x="28" y="168" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">THORChain/Maya front-ends</text><text x="28" y="185" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">median of 4 verified fees</text><rect x="318" y="154" width="206.0" height="26" rx="7" fill="#3a3a3a"/><text x="534.0" y="172" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.5%</text>
  <text x="28" y="226" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Instant exchanges</text><text x="28" y="243" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">median of 4 verified fees</text><rect x="318" y="212" width="206.0" height="26" rx="7" fill="#3a3a3a"/><text x="534.0" y="230" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.5%</text>
  <text x="28" y="284" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Aggregators</text><text x="28" y="301" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">median of 7 verified fees</text><rect x="318" y="270" width="103.0" height="26" rx="7" fill="url(#g)"/><text x="431.0" y="288" font-size="14" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">0.25%</text><text x="28" y="368" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Exchange comparison sites state no fee of their own (cost is the exchange's), so they have no median here.</text>
  <text x="28" y="396" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Shieldz cross-chain swap dataset v1.0.1, 2026-10-10. Fees from official pages only.</text>
  <text x="832" y="396" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
