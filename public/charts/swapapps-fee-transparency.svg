<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="Share of cross-chain swap apps with a verifiable fee, by category: Instant exchanges 27% (4 of 15), Wallets 31% (11 of 35), Aggregators 52% (11 of 21), THORChain/Maya front-ends 67% (4 of 6), Exchange comparison sites 100% (4 of 4). Overall 34 of 81.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="469" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Most cross-chain swap apps don't publish a fee you can check</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Share of active apps whose own fee is stated on a current official page</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">% verified</text>
  <text x="28" y="110" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Instant exchanges</text><text x="28" y="127" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">4 of 15 publish a fee we could verify</text><rect x="318" y="96" width="111.2" height="26" rx="7" fill="#f5361c"/><text x="439.2" y="114" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">27%</text>
  <text x="28" y="168" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Wallets</text><text x="28" y="185" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">11 of 35 publish a fee we could verify</text><rect x="318" y="154" width="127.7" height="26" rx="7" fill="#f5361c"/><text x="455.7" y="172" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">31%</text>
  <text x="28" y="226" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Aggregators</text><text x="28" y="243" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">11 of 21 publish a fee we could verify</text><rect x="318" y="212" width="214.2" height="26" rx="7" fill="#3a3a3a"/><text x="542.2" y="230" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">52%</text>
  <text x="28" y="284" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">THORChain/Maya front-ends</text><text x="28" y="301" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">4 of 6 publish a fee we could verify</text><rect x="318" y="270" width="276.0" height="26" rx="7" fill="url(#g)"/><text x="604.0" y="288" font-size="14" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">67%</text>
  <text x="28" y="342" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Exchange comparison sites</text><text x="28" y="359" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">4 of 4 publish a fee we could verify</text><rect x="318" y="328" width="412.0" height="26" rx="7" fill="url(#g)"/><text x="740.0" y="346" font-size="14" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">100%</text><text x="28" y="426" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Overall: 34 of 81 apps (42%). The rest publish no rate, contradict themselves, or cite a page older than 18 months.</text>
  <text x="28" y="454" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Shieldz cross-chain swap dataset v1.0.0, 2026-10-10. Fees from official pages only.</text>
  <text x="832" y="454" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
