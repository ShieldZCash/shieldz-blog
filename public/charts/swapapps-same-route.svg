<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 516" width="860" height="516" role="img" aria-label="Fees on top of NEAR Intents' 0.0001% protocol fee: Unstoppable Wallet 0%, Shieldz Swap 0.15%, KyberSwap 0.1-0.2%, ASGARDEX 0.3%, LeoDex 0.45%, BitBox 1.5%.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="515" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Same protocol underneath, very different price on top</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Apps with a verified fee that route swaps through NEAR Intents</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">fee %</text>
  <text x="28" y="110" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents protocol</text><text x="28" y="127" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">on-chain protocol fee</text><rect x="258" y="96" width="3.0" height="26" rx="7" fill="#3a3a3a"/><text x="271.0" y="114" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.0001%</text>
  <text x="28" y="160" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Unstoppable Wallet</text><text x="28" y="177" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">wallet</text><rect x="258" y="146" width="3.0" height="26" rx="7" fill="#3a3a3a"/><text x="271.0" y="164" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0%</text>
  <text x="28" y="210" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Shieldz Swap</text><text x="28" y="227" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">aggregator</text><rect x="258" y="196" width="44.2" height="26" rx="7" fill="url(#g)"/><text x="312.3" y="214" font-size="14" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">0.15%</text>
  <text x="28" y="260" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">KyberSwap</text><text x="28" y="277" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">aggregator, NEAR route tier</text><rect x="258" y="246" width="59.0" height="26" rx="7" fill="#3a3a3a"/><text x="327.0" y="264" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.1-0.2%</text>
  <text x="28" y="310" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">ASGARDEX</text><text x="28" y="327" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">frontend</text><rect x="258" y="296" width="88.5" height="26" rx="7" fill="#3a3a3a"/><text x="356.5" y="314" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.3%</text>
  <text x="28" y="360" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">LeoDex</text><text x="28" y="377" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">aggregator</text><rect x="258" y="346" width="132.8" height="26" rx="7" fill="#3a3a3a"/><text x="400.8" y="364" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.45%</text>
  <text x="28" y="410" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">BitBox</text><text x="28" y="427" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">wallet</text><rect x="258" y="396" width="442.5" height="26" rx="7" fill="#f5361c"/><text x="710.5" y="414" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">1.5%</text><text x="28" y="472" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">The protocol's cut is a rounding error. Almost everything you pay is the app's markup.</text>
  <text x="28" y="500" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Shieldz cross-chain swap dataset v1.0.0, 2026-10-10. Fees from official pages only.</text>
  <text x="832" y="500" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
