<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 496" width="860" height="496" role="img" aria-label="All-in cost of swapping USDC on Solana to ETH on Ethereum by size: $100 via NEAR Intents 0.51%, $100 via Chainflip 0.80%, $1000 via NEAR Intents 0.44%, $1000 via Chainflip 0.25%, $10000 via NEAR Intents 0.50%, $10000 via Chainflip 0.24%.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="495" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">USDC on Solana to ETH on Ethereum: cost by swap size</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">All-in cost as a share of the amount, cheapest route highlighted</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">% of swap</text>
  <text x="28" y="126" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$100</text><text x="226" y="123" text-anchor="end" font-size="12" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents</text><rect x="238" y="108" width="217.3" height="22" rx="6" fill="url(#g)"/><text x="465.3" y="124" font-size="14" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">0.51% · $0.51 · ~27 s</text><text x="226" y="163" text-anchor="end" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Chainflip</text><rect x="238" y="148" width="339.7" height="22" rx="6" fill="#3a3a3a"/><text x="587.7" y="164" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.80% · $0.80 · ~3 min</text><text x="28" y="240" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$1,000</text><text x="226" y="237" text-anchor="end" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents</text><rect x="238" y="222" width="186.3" height="22" rx="6" fill="#3a3a3a"/><text x="434.3" y="238" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.44% · $4.41 · ~27 s</text><text x="226" y="277" text-anchor="end" font-size="12" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Chainflip</text><rect x="238" y="262" width="106.6" height="22" rx="6" fill="url(#g)"/><text x="354.6" y="278" font-size="14" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">0.25% · $2.53 · ~3 min</text><text x="28" y="354" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$10,000</text><text x="226" y="351" text-anchor="end" font-size="12" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents</text><rect x="238" y="336" width="209.6" height="22" rx="6" fill="#3a3a3a"/><text x="457.6" y="352" font-size="14" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">0.50% · $49.66 · ~29 s</text><text x="226" y="391" text-anchor="end" font-size="12" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Chainflip</text><rect x="238" y="376" width="100.6" height="22" rx="6" fill="url(#g)"/><text x="348.6" y="392" font-size="14" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">0.24% · $23.84 · ~3 min</text><text x="28" y="456" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Chainflip's network fee has a $0.50 floor, so it loses at $100. NEAR Intents adds a 0.20% fee of its own, so it loses above that.</text>
  <text x="28" y="480" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Measured on swap.shieldz.cash, 2026-10-28 16:30 UTC. ETH price: CoinGecko, same minute.</text>
  <text x="832" y="480" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
