<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" width="860" height="490" role="img" aria-label="Cost of swapping 1,000 USDC on Solana to ETH, all fees included: Chainflip → Ethereum 2.53 dollars, Chainflip → Arbitrum 3.79 dollars, NEAR Intents → Ethereum 4.41 dollars, NEAR Intents → Arbitrum 4.96 dollars, NEAR Intents → Base 5.05 dollars.">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fb573"/><stop offset="1" stop-color="#57d497"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="859" height="489" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="860" height="5" fill="#2fb573"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">1,000 USDC on Solana to ETH: what each route costs</text>
  <text x="28" y="66" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Every route the router got back, quoted at the same moment, all fees included</text>
  <text x="832" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">USD</text>
  <text x="28" y="116" font-size="15" font-weight="600" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Chainflip → Ethereum</text><text x="28" y="135" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">ETH on Ethereum · settles ~3 min</text><rect x="298" y="102" width="138.8" height="30" rx="8" fill="url(#g)"/><text x="448.8" y="123" font-size="16" font-weight="700" fill="#57d497" font-family="ui-sans-serif,system-ui,sans-serif">$2.53 · 0.4280 ETH</text>
  <text x="28" y="178" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Chainflip → Arbitrum</text><text x="28" y="197" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">ETH on Arbitrum · settles ~3 min</text><rect x="298" y="164" width="208.4" height="30" rx="8" fill="#3a3a3a"/><text x="518.4" y="185" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$3.79 · 0.4274 ETH</text>
  <text x="28" y="240" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents → Ethereum</text><text x="28" y="259" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">ETH on Ethereum · settles ~27 s</text><rect x="298" y="226" width="242.5" height="30" rx="8" fill="#3a3a3a"/><text x="552.5" y="247" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$4.41 · 0.4272 ETH</text>
  <text x="28" y="302" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents → Arbitrum</text><text x="28" y="321" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">ETH on Arbitrum · settles ~21 s</text><rect x="298" y="288" width="272.6" height="30" rx="8" fill="#3a3a3a"/><text x="582.6" y="309" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$4.96 · 0.4269 ETH</text>
  <text x="28" y="364" font-size="15" font-weight="600" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">NEAR Intents → Base</text><text x="28" y="383" font-size="11.5" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">ETH on Base · settles ~24 s</text><rect x="298" y="350" width="277.2" height="30" rx="8" fill="#3a3a3a"/><text x="587.2" y="371" font-size="16" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">$5.05 · 0.4269 ETH</text><text x="28" y="450" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">$1,000 in minus the ETH out at $2,330.75. Includes the 0.15% Shieldz fee ($1.50), protocol fees and delivery gas.</text>
  <text x="28" y="474" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Measured on swap.shieldz.cash, 2026-10-28 16:30 UTC. ETH price: CoinGecko, same minute. Relay had no route for Solana USDC.</text>
  <text x="832" y="474" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
