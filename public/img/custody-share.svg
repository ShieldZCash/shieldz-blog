<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="How much of a payment passes through the provider's custody: custodial gateways and escrow/hold models hold 100% of the payment before it reaches you, so it can be frozen or AML-reviewed. BTCPay Server and Shieldz are non-custodial at 0%, funds settle straight to your wallet.">
  <rect x="0.5" y="0.5" width="759" height="469" rx="16" fill="#161616" stroke="#262626"/>
  <rect x="0" y="0" width="760" height="5" fill="#f5361c"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">How much of your payment the provider holds</text>
  <text x="30" y="62" font-size="13" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">Non-custodial means there is no balance to freeze or AML-review.</text>
  <line x1="30" y1="84.0" x2="730" y2="84.0" stroke="#242424"/><text x="736" y="88.0" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">100%</text>
  <line x1="30" y1="154.5" x2="730" y2="154.5" stroke="#242424"/><text x="736" y="158.5" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">75%</text>
  <line x1="30" y1="225.0" x2="730" y2="225.0" stroke="#242424"/><text x="736" y="229.0" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">50%</text>
  <line x1="30" y1="295.5" x2="730" y2="295.5" stroke="#242424"/><text x="736" y="299.5" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">25%</text>
  <line x1="30" y1="366.0" x2="730" y2="366.0" stroke="#242424"/><text x="736" y="370.0" font-size="11" fill="#777" font-family="ui-sans-serif,system-ui,sans-serif">0%</text>
  <rect x="79.5" y="120.8" width="76" height="245.2" rx="6" fill="#3a3a3a"/><text x="117.5" y="110.8" text-anchor="middle" font-size="15" font-weight="700" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">100%</text><text x="117.5" y="388.0" text-anchor="middle" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Custodial gateway</text>
  <rect x="254.5" y="120.8" width="76" height="245.2" rx="6" fill="#3a3a3a"/><text x="292.5" y="110.8" text-anchor="middle" font-size="15" font-weight="700" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">100%</text><text x="292.5" y="388.0" text-anchor="middle" font-size="12.5" fill="#9c9c9c" font-family="ui-sans-serif,system-ui,sans-serif">Escrow / hold model</text>
  <rect x="429.5" y="360.0" width="76" height="6.0" rx="6" fill="#f5361c"/><text x="467.5" y="350.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ff9e8c" font-family="ui-sans-serif,system-ui,sans-serif">0%</text><text x="467.5" y="388.0" text-anchor="middle" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">BTCPay Server</text>
  <rect x="604.5" y="360.0" width="76" height="6.0" rx="6" fill="#f5361c"/><text x="642.5" y="350.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ff9e8c" font-family="ui-sans-serif,system-ui,sans-serif">0%</text><text x="642.5" y="388.0" text-anchor="middle" font-size="12.5" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif">Shieldz</text>
  <text x="730" y="454" text-anchor="end" font-size="11" fill="#777" font-family="Menlo,ui-monospace,monospace">shieldz.cash · structural comparison of custody models</text>
