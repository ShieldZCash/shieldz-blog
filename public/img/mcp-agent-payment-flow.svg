<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Flow diagram: an AI agent calls create_payment_link on the Shieldz MCP server, which returns a hosted checkout URL, the buyer pays, and funds settle to your wallet. The agent reads results back with get_account_status.">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f5361c"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#777777"/>
    </marker>
    <style>
      .box { fill:#161616; stroke:#262626; stroke-width:1.5; }
      .title { fill:#fafafa; font:700 20px ui-sans-serif,system-ui,sans-serif; }
      .sub { fill:#9c9c9c; font:400 13px ui-sans-serif,system-ui,sans-serif; }
      .lbl { fill:#ff9e8c; font:600 13px Menlo,ui-monospace,monospace; }
      .lblm { fill:#9c9c9c; font:600 13px Menlo,ui-monospace,monospace; }
      .flow { stroke:#f5361c; stroke-width:2; fill:none; }
      .ret { stroke:#777777; stroke-width:1.6; fill:none; stroke-dasharray:5 5; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="439" rx="16" fill="#0e0e0e" stroke="#1c1c1c"/>
  <rect x="0" y="0" width="1000" height="5" fill="#f5361c"/>

  <text x="30" y="46" fill="#fafafa" font="700 22px ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">How an AI agent gets paid over MCP</text>

  <!-- nodes -->
  <g>
    <rect class="box" x="30" y="150" width="190" height="96" rx="14"/>
    <text class="title" x="125" y="192" text-anchor="middle">AI agent</text>
    <text class="sub" x="125" y="216" text-anchor="middle">Claude, Cursor, Goose</text>
  </g>
  <g>
    <rect class="box" x="280" y="150" width="190" height="96" rx="14"/>
    <text class="title" x="375" y="192" text-anchor="middle">Shieldz</text>
    <text class="sub" x="375" y="216" text-anchor="middle">MCP server</text>
  </g>
  <g>
    <rect class="box" x="530" y="150" width="190" height="96" rx="14"/>
    <text class="title" x="625" y="185" text-anchor="middle">Hosted checkout</text>
    <text class="sub" x="625" y="209" text-anchor="middle">pay_url + QR</text>
  </g>
  <g>
    <rect class="box" x="780" y="150" width="190" height="96" rx="14"/>
    <text class="title" x="875" y="185" text-anchor="middle">Your wallet</text>
    <text class="sub" x="875" y="209" text-anchor="middle">funds settle here</text>
  </g>

  <!-- forward arrows -->
  <line class="flow" x1="220" y1="198" x2="272" y2="198" marker-end="url(#arrow)"/>
  <text class="lbl" x="246" y="138" text-anchor="middle">create_</text>
  <text class="lbl" x="246" y="154" text-anchor="middle">payment_link</text>

  <line class="flow" x1="470" y1="198" x2="522" y2="198" marker-end="url(#arrow)"/>
  <text class="lbl" x="496" y="146" text-anchor="middle">pay_url</text>

  <line class="flow" x1="720" y1="198" x2="772" y2="198" marker-end="url(#arrow)"/>
  <text class="lbl" x="746" y="146" text-anchor="middle">buyer pays</text>

  <!-- return path: wallet/shieldz -> agent -->
  <path class="ret" d="M 625 246 L 625 330 L 125 330 L 125 250" marker-end="url(#arrowMuted)"/>
  <text class="lblm" x="375" y="352" text-anchor="middle">get_account_status  ·  signed webhook</text>

  <text x="30" y="418" fill="#777777" font-size="12" font-family="Menlo,ui-monospace,monospace">Non-custodial · keyless · funds never touch Shieldz</text>
  <text x="970" y="418" text-anchor="end" fill="#777777" font-size="12" font-family="Menlo,ui-monospace,monospace">shieldz.cash</text>
</svg>
